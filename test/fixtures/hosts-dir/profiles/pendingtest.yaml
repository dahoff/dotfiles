# Config-only apps plus one missing OS package and one missing custom tool.
# faketool uses the test fixture packages/custom/testtool, never a real tool.
packages:
  - name: claude
    config:
      dir: claude
  - name: scripts
    config:
      dir: scripts

  - name: nonexistent-pkg
    apt: dotfiles-nonexistent-pkg
    dnf: dotfiles-nonexistent-pkg
    brew: dotfiles-nonexistent-pkg

  - name: faketool
    custom:
      check: false
      script: custom/testtool/install.sh
      dropin: custom/testtool/files/50-testtool.sh
