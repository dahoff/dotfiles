app:
  name: claude
  description: Claude Code CLI configuration (settings, global instructions, statusline, tmux notifications)

files:
  - src: CLAUDE.md
    dest: ~/.claude/CLAUDE.md
    mode: '0644'
  - src: settings.json
    dest: ~/.claude/settings.json
    mode: '0644'
    strategy: merge
  - src: settings.local.json
    dest: ~/.claude/settings.local.json
    mode: '0644'
  - src: statusline-command.sh
    dest: ~/.claude/statusline-command.sh
    mode: '0644'
  - src: tmux-notify.sh
    dest: ~/.claude/tmux-notify.sh
    mode: '0755'

backup:
  dir: ~/.bak/claude
  max_backups: 3

post_install:
  - mkdir -p ~/.claude

# How to install the tool
install:
  check: command -v claude
